<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <h2>Configure Fields</h2>
    <label for="latField">Latitude Field:</label>
    <select id="latField"></select>
    
    <label for="lonField">Longitude Field:</label>
    <select id="lonField"></select>
    
    <label for="colorField">Color Field:</label>
    <select id="colorField"></select>
    
    <label for="sizeField">Size Field:</label>
    <select id="sizeField"></select>
    
    <label for="labelField">Label Field:</label>
    <select id="labelField"></select>

</body>
<script>
  $(document).ready(function () {
    // The only difference between an extension in a dashboard and an extension
    // running in a popup is that the popup extension must use the method
    // initializeDialogAsync instead of initializeAsync for initialization.
    // This has no affect on the development of the extension but is used internally.
    tableau.extensions.initializeDialogAsync({configure: configure}).then(payload => {
        const initialConfig = JSON.parse(payload);
        document.getElementById("latitudeField").value = initialConfig.latField;
        document.getElementById("longitudeField").value = initialConfig.lonField;
        document.getElementById("colorField").value = initialConfig.colorField;
        document.getElementById("sizeField").value = initialConfig.sizeField;
        document.getElementById("labelField").value = initialConfig.labelField;
    }).catch(err => {
        console.error("Error initializing dialog:", err);
    });

  }); 

  function closeDialog() {
    const config = {
      latField: document.getElementById("latitudeField").value,
      lonField: document.getElementById("longitudeField").value,
      colorField: document.getElementById("colorField").value,
      sizeField: document.getElementById("sizeField").value,
      labelField: document.getElementById("labelField").value
    };

    tableau.extensions.ui.closeDialog(JSON.stringify(config));
    console.log("Settings saved");
  }

  document.getElementById("applyConfigButton").addEventListener("click", applyConfiguration);

</script>
</html>
